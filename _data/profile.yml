name: Kecheng Shi
initials: ks
field: Cryptography & distributed computing
role: PhD student at CISPA and Saarland University
advisor:
  name: Julian Loss
  url: https://www.julianloss.com/
intro: >-
  I study how authentication changes feasibility in distributed consensus.
  I'm interested in feasibility of distributed computing influenced from different perspectives,
  including authentication setups, powers of the adversary and requirement of given tasks.

questions:
  - What can digital signatures achieve when only some parties have registered keys?
  - When is agreement possible if a party can miss both incoming and outgoing messages?
  - How quickly can a protocol terminate when fewer faults occur than it was designed to tolerate?

