name: Kecheng Shi
initials: kcshi
field: Cryptography & distributed computing
role: PhD student at CISPA and Saarland University
advisor:
  name: Julian Loss
  url: https://www.julianloss.com/
intro: >-
  I study cryptography and distributed consensus.
  I'm interested in feasibility of distributed computing influenced from different perspectives,
  including authentication setups, powers of the adversary and goals of the given tasks.

questions:
  - What is the feasibility condition when each party is only authenticated to some of parties?
  - When is agreement possible if a party can drop incoming and outgoing messages?
  - How quickly can a protocol terminate when fewer faults occur than it was designed to tolerate?

# Each list item is one paragraph. Use [link text](https://...) for a link.
background:
  - >-
    I am a fourth-year doctoral student at [Saarland University](https://www.uni-saarland.de/en/home.html)
    and the CISPA Helmholtz Center for Information Security.
  - >-
    Before joining CISPA in 2023, I obtained master degree in mathematics at the Southern University
    of Science and Technology in Shenzhen, where I later worked as a research assistant studying class field theory.

